<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>特価画像</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <header class="heading">
        <p class="eyebrow">店頭特価</p>
        <h1>特価画像</h1>
        <p class="lead">カードを選んで名前と価格を入れると、見本と同じ縦長画像ができます。1350×1962で保存します。</p>
      </header>

      <input id="file" class="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">

      <button type="button" id="drop" class="drop">
        <span class="slot" aria-hidden="true">
          <img id="thumb" alt="">
          <span id="slot-empty">＋</span>
        </span>
        <span class="drop-copy">
          <span class="drop-title">カード画像</span>
          <span id="drop-label">クリックして選択、または ⌘V で貼り付け</span>
        </span>
      </button>

      <label class="field">
        <span>カード名</span>
        <input id="name" autocomplete="off" placeholder="古えの墳墓/Ancient Tomb">
      </label>

      <label class="field">
        <span>セット表記 <em>空なら出さない</em></span>
        <input id="note" autocomplete="off" placeholder="[TMP]//JP/HPLD">
      </label>

      <label class="field">
        <span>販売価格</span>
        <input id="price" inputmode="numeric" autocomplete="off" placeholder="17500">
      </label>

      <div class="actions">
        <button type="button" id="save" class="save" disabled>PNGを保存</button>
        <button type="button" id="next" class="next">次のカード</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <p class="hint">カード画像は ⌘V で貼り付けできます。⌘↩ でも保存できます。画像はここから外に送信しません。</p>
    </section>

    <section class="preview-wrap">
      <p class="preview-label">プレビュー</p>
      <canvas id="preview" width="1350" height="1962"></canvas>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
